<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Schakelkastconfigurator Hoppenbrouwers</title>
    <meta
      name="Schakelkast"
      content="Schakelkastconfigurator van Hoppenbrouwers"
    />
    <link rel="icon" href="/public/Hoppenbrouwers-logo-liggend-kleur-rgb-1200.ico" /> 
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="site-header">
        <div class="top-header">
          <div class="brand-wrap">
            <a
              href="https://www.hoppenbrouwerstechniek.nl"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="Hoppenbrouwers website">
              <img
                class="brand-logo"
                src="/images/Hoppenbrouwers-logo-liggend-kleur-rgb-1200.png"
                alt="Hoppensbrouwers"
              />
            </a>
          </div>

          <nav id="main-nav" class="main-nav" aria-label="Main navigation">
            <!--<a href="#">Particulier</a>
            <a href="#">Zakelijk</a>
            <a href="#">Werken bij</a> -->
            <a 
              href="https://www.hoppenbrouwerstechniek.nl/vestiging/veenendaal/"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="Contact Hoppenbrouwers Veenendaal">
              Contact
            </a>
          </nav>

          <!-- hamburger button shown on small screens (moved to right of header) -->
          <button class="hamburger" aria-label="Open menu" aria-expanded="false" aria-controls="main-nav" aria-haspopup="true">
            <span class="hamburger-icon" aria-hidden="true">☰</span>
          </button>

        </header>

      <main class="content">
        <div class="viewer-grid">
          <aside 
              id="viewer-stage-left"
              class="viewer-stage-left"
              aria-label="Configurator">

            <section
              id="config-step-1"
               class="config-step config-step--selection active"
               data-step="1"
            >
              <h2 class="panel-title">Kies gewenste kastbehuizing</h2>

              <div id="cabinet-list" class="model-list" role="list" tabindex="0"></div>

              <div class="panel-footer">
                <div id="selected-name" class="selected-name">Kast 1</div>
                <button id="step1-next-btn" class="next-btn">Volgende</button>
              </div>
            </section>

            <section
              id="config-step-2"
                class="config-step config-step--choice"
              data-step="2"
              hidden
            >
                <h2 class="panel-title">Kies de binnenkomende spanning van de kast</h2>
                <div class="choice-list voltage-choice-list" role="radiogroup" aria-label="Binnenkomende spanning">
                  <label class="choice-option voltage-choice"><input type="radio" name="voltage" value="230 VAC"> <img src="/images/230VAC.png" alt=""><span>230 VAC</span></label>
                  <label class="choice-option voltage-choice"><input type="radio" name="voltage" value="400 VAC"> <img src="/images/400VAC.png" alt=""><span>400 VAC</span></label>
                  <label class="choice-option voltage-choice"><input type="radio" name="voltage" value="24 VDC"> <img src="/images/24V.png" alt=""><span>24 VDC</span></label>
                </div>
              <div class="panel-footer">
                <button id="back-btn" class="back-btn">Vorige</button>
                <button id="step2-next-btn" class="next-btn">Volgende</button>
              </div>
           </section>

           <section
             id="config-step-3"
             class="config-step config-step--choice"
             data-step="3"
             hidden
           >
             <h2 class="panel-title">Kies het merk van de installatieautomaat</h2>
             <div class="choice-list brand-choice-list" role="radiogroup" aria-label="Merk installatieautomaat">
               <label class="choice-option brand-choice"><input type="radio" name="breakerBrand" value="Eaton"> <img src="/images/Eaton-Logo.png" alt="Eaton"></label>
               <label class="choice-option brand-choice"><input type="radio" name="breakerBrand" value="Siemens"> <img src="/images/Siemens-Logo.png" alt="Siemens"></label>
               <label class="choice-option brand-choice"><input type="radio" name="breakerBrand" value="ABB"> <img src="/images/ABB-Logo.png" alt="ABB"></label>
             </div>
             <div class="panel-footer">
              <button id="step3-back-btn" class="back-btn">Vorige</button>
              <button id="step3-next-btn" class="next-btn">Volgende</button>
             </div>
           </section>

           <section
             id="config-step-4"
             class="config-step config-step--choice"
             data-step="4"
             hidden
           >
             <h2 class="panel-title">Kies de voeding</h2>
             <div class="choice-list" role="radiogroup" aria-label="Voeding">
               <label class="choice-option"><input type="radio" name="powerSupply" value="Weidmuller"> <span>Weidmuller</span></label>
               <label class="choice-option"><input type="radio" name="powerSupply" value="Phoenix"> <span>Phoenix</span></label>
             </div>
             <div class="panel-footer">
              <button id="step4-back-btn" class="back-btn">Vorige</button>
              <button id="step4-next-btn" class="next-btn">Volgende</button>
             </div>
           </section>

           <section id="config-step-5" class="config-step config-step--choice" data-step="5" hidden>
             <h2 class="panel-title">Kies de voorzieningen in de kast</h2>
             <div class="choice-list feature-list">
               <label class="choice-row"><span>Verlichting</span><select name="lighting"><option value="Nee">Nee</option><option value="Ja">Ja</option></select></label>
               <label class="choice-row"><span>Verwarming</span><select name="heating"><option value="Nee">Nee</option><option value="Ja">Ja</option></select></label>
               <label class="choice-row"><span>Ventilatie</span><select name="ventilation"><option value="Nee">Nee</option><option value="Ja">Ja</option></select></label>
             </div>
             <div class="panel-footer">
              <button id="step5-back-btn" class="back-btn">Vorige</button>
              <button id="step5-next-btn" class="next-btn">Volgende</button>
             </div>
           </section>

           <section id="config-step-6" class="config-step config-step--choice" data-step="6" hidden>
             <h2 class="panel-title">Kies het aantal IO-kaarten</h2>
             <div class="io-list">
               <label class="io-row"><span>DI-kaarten</span><input type="number" name="di" min="0" value="0"></label>
               <label class="io-row"><span>DO-kaarten</span><input type="number" name="do" min="0" value="0"></label>
               <label class="io-row"><span>AI-kaarten</span><input type="number" name="ai" min="0" value="0"></label>
               <label class="io-row"><span>AO-kaarten</span><input type="number" name="ao" min="0" value="0"></label>
               <label class="io-row"><span>Safe DI-kaarten</span><input type="number" name="safeDi" min="0" value="0"></label>
               <label class="io-row"><span>Safe DO-kaarten</span><input type="number" name="safeDo" min="0" value="0"></label>
               <label class="io-row"><span>Safe AI-kaarten</span><input type="number" name="safeAi" min="0" value="0"></label>
             </div>
             <div class="panel-footer">
              <button id="step6-back-btn" class="back-btn">Vorige</button>
              <button id="step6-next-btn" class="next-btn">Afronden</button>
             </div>
           </section>
          </aside>
          
          <div 
              id="viewer-stage"
              class="viewer-stage"
              aria-label="3D cabinet preview">
              
          </div>
        </div>

      </main>
    </div>

    <script type="module" src="/src/main.ts"></script>

    <script>
      // small menu toggle for the header hamburger
      (function(){
        const hamb = document.querySelector('.hamburger');
        const nav = document.getElementById('main-nav');
        if (!hamb || !nav) return;
        hamb.addEventListener('click', (e) => {
          e.stopPropagation();
          const isOpen = nav.classList.toggle('open');
          hamb.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
        });
        // close when clicking outside
        document.addEventListener('click', (e) => {
          if (!nav.classList.contains('open')) return;
          if (!hamb.contains(e.target) && !nav.contains(e.target)) {
            nav.classList.remove('open');
            hamb.setAttribute('aria-expanded','false');
          }
        });
        // close on escape
        document.addEventListener('keydown', (e) => {
          if (e.key === 'Escape') {
            nav.classList.remove('open');
            hamb.setAttribute('aria-expanded','false');
          }
        });
      })();
    </script>
  </body>
</html>
