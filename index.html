<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Schakelkastconfigurator Hoppenbrouwers</title>
    <meta
      name="Schakelkast"
      content="Schakelkastconfigurator van Hoppenbrouwers"
    />
    <link rel="icon" href="/public/Hoppenbrouwers-logo-liggend-kleur-rgb-1200.ico" /> 
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="site-header">
        <div class="top-header">
          <div class="brand-wrap">
            <a
              href="https://www.hoppenbrouwerstechniek.nl"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="Hoppenbrouwers website">
              <img
                class="brand-logo"
                src="/images/Hoppenbrouwers-logo-liggend-kleur-rgb-1200.png"
                alt="Hoppensbrouwers"
              />
            </a>
          </div>

          <nav id="main-nav" class="main-nav" aria-label="Main navigation">
            <!--<a href="#">Particulier</a>
            <a href="#">Zakelijk</a>
            <a href="#">Werken bij</a> -->
            <a 
              href="https://www.hoppenbrouwerstechniek.nl/vestiging/veenendaal/"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="Contact Hoppenbrouwers Veenendaal">
              Contact
            </a>
          </nav>

          <!-- hamburger button shown on small screens (moved to right of header) -->
          <button class="hamburger" aria-label="Open menu" aria-expanded="false" aria-controls="main-nav" aria-haspopup="true">
            <span class="hamburger-icon" aria-hidden="true">☰</span>
          </button>

        </header>

      <main class="content">
        <div class="viewer-grid">
          <aside 
              id="viewer-stage-left"
              class="viewer-stage-left"
              aria-label="Configurator">

            <section
              id="config-step-1"
               class="config-step config-step--selection active"
               data-step="1"
            >
              <h2 class="panel-title">Kies gewenste kastbehuizing</h2>

              <div class="model-list" role="list" tabindex="0">
                <button id="kast1-btn" class="model-btn active" data-model="kast.gltf" role="listitem">Rittal AX 1018000 1000x1000x300mm</button>
                <button id="kast2-btn" class="model-btn" data-model="kast2.gltf" role="listitem">Rittal AX 1012000 600x760x210mm</button>
                <button id="kast3-btn" class="model-btn" data-model="kast3.gltf" role="listitem">Rittal AX 1003000 300x300x210mm</button>
                <!-- add more model buttons here; the list will scroll if it becomes long -->
              </div>

              <div class="panel-footer">
                <div id="selected-name" class="selected-name">Kast 1</div>
                <button id="step1-next-btn" class="next-btn">Volgende</button>
              </div>
            </section>

            <section
              id="config-step-2"
              class="config-step config-step--door"
              data-step="2"
              hidden
            >
              <h2 class="panel-title">Kies gewenste deurpositie</h2>
              
              <div class="model-btn-container">
                <button id="doorLeft-btn" class="model-btn-door" data-door="door1.gltf" role="listitem">Deur links</button>
                <button id="doorRight-btn" class="model-btn-door active" data-door="door2.gltf" role="listitem">Deur rechts</button>
              </div>
              
              <div class="panel-footer">
                <button id="back-btn" class="back-btn">Vorige</button>

                <div id="selected-door-name" class="selected-name">Rechts</div>
                
                <button id="step2-next-btn" class="next-btn">Volgende</button>
              </div>
           </section>

           <section
             id="config-step-3"
             class="config-step config-step--components"
             data-step="3"
             hidden
           >
             <h2 class="panel-title">Plaats componenten op de voordeur</h2>

             <div class="component-layout">
               <div id="front-view-2d" class="front-view-2d" aria-label="Voorbeeld van de voorkant van de kast">
                 <div class="front-view-toolbar" aria-label="Zoom en component toevoegen">
                   <div class="zoom-controls" aria-label="Zoominstellingen">
                     <button type="button" class="zoom-btn zoom-in" data-zoom-action="in" aria-label="Inzoomen"><span aria-hidden="true">+</span></button>
                     <button type="button" class="zoom-btn zoom-out" data-zoom-action="out" aria-label="Uitzoomen"><span aria-hidden="true">−</span></button>
                   </div>
                   <button id="add-component-btn" class="add-component-btn" aria-label="Component toevoegen"><span aria-hidden="true">+</span></button>
                 </div>
                 <div class="cabinet-face">
                   <div id="door-panel" class="door-panel"></div>
                   <div id="component-layer" class="component-layer"></div>
                 </div>
                 <div id="component-menu" class="component-menu" hidden>                   <div class="component-group">
                     <button type="button" class="component-group-btn" data-group="hoofdschakelaars">
                       <span>Hoofdschakelaars</span>
                       <span class="chevron" aria-hidden="true">▸</span>
                     </button>
                     <div class="component-submenu" hidden>
                       <button type="button" class="component-option" data-component="hoofdschakelaar">EATON 057856 T0-1-8200/V/SVB</button>
                     </div>
                   </div>
                   <div class="component-group">
                     <button type="button" class="component-group-btn" data-group="zekeringen">
                       <span>Zekeringen</span>
                       <span class="chevron" aria-hidden="true">▸</span>
                     </button>
                     <div class="component-submenu" hidden>
                       <button type="button" class="component-option" data-component="zekering" disabled>Zekering (binnenkort)</button>
                     </div>
                   </div>
                   <div class="component-group">
                     <button type="button" class="component-group-btn" data-group="drukschakelaars">
                       <span>Drukschakelaars</span>
                       <span class="chevron" aria-hidden="true">▸</span>
                     </button>
                     <div class="component-submenu" hidden>
                       <button type="button" class="component-option" data-component="drukschakelaar" disabled>Drukschakelaar (binnenkort)</button>
                     </div>
                   </div>
                   <div class="component-group">
                     <button type="button" class="component-group-btn" data-group="signaalverlichting">
                       <span>Signaalverlichting</span>
                       <span class="chevron" aria-hidden="true">▸</span>
                     </button>
                     <div class="component-submenu" hidden>
                       <button type="button" class="component-option" data-component="signaallampje" disabled>Signaallampje (binnenkort)</button>
                     </div>
                   </div>
                 </div>
               </div>
             </div>

             <div class="panel-footer">
              <button id="step3-back-btn" class="back-btn">Vorige</button>
              <div id="selected-component-name" class="selected-name">Geen onderdeel</div>
              <button id="step3-next-btn" class="next-btn">Volgende</button>
             </div>
           </section>
          </aside>
          
          <div 
              id="viewer-stage"
              class="viewer-stage"
              aria-label="3D cabinet preview">
              
          </div>
        </div>

      </main>
    </div>

    <script type="module" src="/src/main.ts"></script>

    <script>
      // small menu toggle for the header hamburger
      (function(){
        const hamb = document.querySelector('.hamburger');
        const nav = document.getElementById('main-nav');
        if (!hamb || !nav) return;
        hamb.addEventListener('click', (e) => {
          e.stopPropagation();
          const isOpen = nav.classList.toggle('open');
          hamb.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
        });
        // close when clicking outside
        document.addEventListener('click', (e) => {
          if (!nav.classList.contains('open')) return;
          if (!hamb.contains(e.target) && !nav.contains(e.target)) {
            nav.classList.remove('open');
            hamb.setAttribute('aria-expanded','false');
          }
        });
        // close on escape
        document.addEventListener('keydown', (e) => {
          if (e.key === 'Escape') {
            nav.classList.remove('open');
            hamb.setAttribute('aria-expanded','false');
          }
        });
      })();
    </script>
  </body>
</html>
